# One note per wrong option, keyed by the exact English option text from the ISED bank.
B-005-001-001:
  35.25 kHz: "That divides by 100. MHz to kHz is one step down the ladder: multiply by 1000."
  3 525 000 kHz: That multiplies by a million (two steps). One step, ×1000, gives 3 525 kHz.
  352.5 kHz: That multiplies by only 100. kilo to mega is a factor of 1000.
B-005-001-002:
  0.003 amperes: "That divides by a million. Milli to base is one step: 3000 ÷ 1000 = 3 A."
  0.3 amperes: That divides by 10 000. One step is ÷1000, giving 3 A.
  0.03 amperes: That divides by 100 000. 3000 mA ÷ 1000 = 3 A.
B-005-001-003:
  10 Hz: Kilo means 1000, not 10.
  100 Hz: Kilo means 1000, not 100.
  10 000 Hz: That's 10 kHz. 1 kHz = 1 000 Hz.
B-005-001-004:
  10 microfarads: "Ten times too big. Pico to micro is two steps, ÷1 000 000: 1 000 000 pF = 1 µF."
  0.01 microfarads: That divides by 100 million. Two steps of 1000 give exactly 1 µF.
  0.001 microfarads: "That divides by a billion: three steps. pico to micro is only two."
B-005-001-005:
  5 watts: That's 5000 mW. 500 mW ÷ 1000 = 0.5 W.
  50 watts: "That's 50 000 mW. Milli to watts is ÷1000: 0.5 W."
  0.05 watts: That divides by 10 000. 500 mW is half a watt.
B-005-001-006:
  0.1 ohms: Kilo multiplies by 1000; it never makes a value smaller.
  0.001 ohms: That's a milliohm. A kilohm is 1000 ohms.
  10 ohms: Kilo means 1000, not 10.
B-005-001-007:
  0.740 MHz: "The digits moved wrongly. kHz to MHz is ÷1000: 7040 → 7.040 MHz."
  70.40 MHz: "That divides by 100. One step up is ÷1000: 7.040 MHz."
  0.074 MHz: That divides by 100 000. 7040 kHz is just over 7 MHz.
B-005-001-008:
  2.5 milliamperes: That's 0.0025 A. A quarter ampere, 0.25 A × 1000, is 250 mA.
  0.25 milliamperes: That's a quarter of a milliampere, a thousand times too small.
  250 microamperes: Microamperes are two steps below amperes. 0.25 A is 250 milliamperes.
B-005-001-009:
  0.000 002 mV: "That divides instead of multiplying. Smaller unit, bigger number: 2 V = 2 000 mV."
  2 000 000 mV: That's two steps (×1 000 000), which would be microvolts.
  0.002 mV: That divides by 1000. Going down to milli multiplies by 1000.
B-005-001-010:
  Multiply by 1 000: Going to a bigger unit makes the number smaller, so you divide.
  Divide by 1 000 000: One step (MHz to GHz) is ÷1000, not ÷1 000 000.
  Multiply by 1 000 000: "That multiplies, and by two steps. MHz to GHz is one step up: divide by 1 000."
B-005-001-011:
  100 millihenries: "Ten times too big. Micro to milli is ÷1000: 10 000 µH = 10 mH."
  1 millihenry: That divides by 10 000. One step is ÷1000, giving 10 mH.
  1000 millihenries: That's 1 H = 1000 mH, a hundred times too big.
