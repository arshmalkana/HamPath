# One note per wrong option, keyed by the exact English option text from the ISED bank.
B-003-007-001:
  To convert the received digital signal from the transceiver into an analog signal for the computer: On receive the transceiver gives analog audio, which is converted to digital for the computer, not the other way round.
  To amplify the digital signals to be sent by the transceiver: The interface doesn't amplify digital signals for transmission.
  To demodulate the transmitted signal: Demodulating is done by the radio and software, not by the interface.
B-003-007-002:
  To convert the analog signal from the computer into a digital signal that can be transmitted: The computer's output is digital and must become analog audio, not the other way round.
  To amplify the digital signals to be sent by the transceiver: The interface doesn't amplify digital signals.
  To demodulate the transmitted signal: Demodulating isn't the interface's job.
B-003-007-003:
  Display the transmit frequency: The transceiver displays its own frequency.
  Translate the digital signal into alphanumeric characters: Turning the signal into characters is the software's job.
  Modulate the received signal: The interface doesn't modulate the received signal.
B-003-007-004:
  To provide radio frequency coupling between a computer and a transceiver: The interface carries audio, not RF.
  To amplify the digital signals to be sent by the transceiver: It doesn't amplify digital signals.
  To demodulate the transmitted signal: Demodulating is the radio's and software's job.
B-003-007-005:
  To increase the signal voltage generated by the computer to the level required by the transceiver: Isolation transformers aren't there to raise the voltage.
  To match the impedance of the computer output signal to the impedance of the input of the computer: Impedance matching isn't their purpose; breaking ground loops is.
  To provide a source of DC power for the circuitry in the interface: Transformers don't provide DC power.
B-003-007-006:
  Because they provide a USB connector: A USB connector alone doesn't turn audio into data.
  Because digital signal processing (DSP) is built-in: DSP processes signals, but a codec does the audio conversion for the computer.
  Because they support CAT (Computer Aided Transceiver): CAT controls the radio's settings; it doesn't carry the audio.
