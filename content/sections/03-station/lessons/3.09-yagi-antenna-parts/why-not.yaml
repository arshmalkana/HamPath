# One note per wrong option, keyed by the exact English option text from the ISED bank.
B-003-009-001:
  The reflector: The reflector is a radiating element, not a support.
  The driven element: The driven element radiates; it isn't support.
  The director: The director is a radiating element.
B-003-009-002:
  The boom: The boom isn't a radiating element.
  The director: The director is the shortest.
  The driven element: The driven element is in between.
B-003-009-003:
  The reflector: The reflector is the longest.
  The boom: The boom isn't a radiating element.
  The driven element: The driven element is in between.
B-003-009-004:
  The reflector: The reflector is parasitic, not connected.
  The boom: The boom is just support.
  The director: The director is parasitic, not connected.
