# One note per wrong option, keyed by the exact English option text from the ISED bank.
B-002-002-001:
  Use any words which start with the same letters as your call sign for each letter of your call: Your own words aren't standard; others may not recognize them.
  Talk louder and faster: Louder and faster makes it harder to copy.
  Turn up your microphone gain: More mic gain just distorts.
B-002-002-002:
  Q codes: Q codes are abbreviations, not spelling aids.
  Unique words of your choice: Your own words aren't standard.
  A speech compressor: A speech compressor doesn't help spelling.
