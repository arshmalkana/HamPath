# One note per wrong option, keyed by the exact English option text from the ISED bank.
B-001-002-001:
  Inform your local amateur radio club: Clubs don't keep official records.
  Inform an accredited examiner: Examiners don't track your address.
  Inform Radio Amateurs of Canada (RAC): RAC is a national association, not the regulator.
B-001-002-002:
  five years: It doesn't expire after five years.
  three years: It doesn't expire after three years.
  one year: It doesn't expire after one year.
B-001-002-003:
  you must notify Innovation, Science and Economic Development Canada within 14 days of operation at the new address: It's 30 days from the address change, not 14 days of operation.
  you must not operate until a change of address card is forwarded to Innovation, Science and Economic Development Canada: You can keep operating; just notify ISED.
  within the same province, you do not need to notify Innovation, Science and Economic Development Canada: Even within the same province you must notify ISED.
B-001-002-004:
  must be put on file: Filing it isn't the rule; keep it at the station.
  must be kept in a safe place: A safe place isn't the rule; keep it at the station.
  must be kept on the person to whom it is issued: You don't have to carry it.
B-001-002-005:
  "12": 12 hours is too short.
  "24": 24 hours is too short.
  "72": 72 hours is too long.
B-001-002-006:
  $32: There's no $32 fee.
  $10: There's no $10 fee.
  $24: There's no $24 fee.
B-001-002-007:
  retained in a safety deposit box: A safety deposit box isn't the station address.
  retained on the holder's person: Carrying it isn't required.
  retained in the holder's vehicle: Your vehicle isn't the address you gave ISED.
B-001-002-008:
  $25: It's free.
  $40: It's free.
  $60: It's free; $60 is for a call sign change.
B-001-002-009:
  $55: $55 isn't the fee.
  $30: $30 isn't the fee.
  Free: Changing a call sign isn't free.
