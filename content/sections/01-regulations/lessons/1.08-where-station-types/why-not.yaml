# One note per wrong option, keyed by the exact English option text from the ISED bank.
B-001-008-001:
  Anywhere in Canada only during times of emergency: You can operate anywhere, not only in emergencies.
  Only at the address shown on Innovation, Science and Economic Development Canada records: You're not tied to your address.
  Only within their province or territory: You're not limited to your province.
B-001-008-002:
  Repeater station: Repeaters retransmit two-way traffic.
  HF station: An HF station isn't a one-way type.
  VHF station: A VHF station isn't a one-way type.
B-001-008-003:
  Basic with Honours: Honours isn't needed for kits.
  Basic and Morse code: Morse isn't needed.
  Basic and Advanced: Advanced isn't needed for commercial kits.
B-001-008-004:
  Basic and Morse code: Morse doesn't qualify you.
  Basic with Honours: Honours isn't enough.
  Basic: Basic isn't enough.
