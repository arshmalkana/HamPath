# One note per wrong option, keyed by the exact English option text from the ISED bank.
B-001-023-001:
  An amateur radio operator must follow Innovation, Science and Economic Development Canada's antenna siting procedures: "That's correct: follow ISED's siting procedures."
  Innovation, Science and Economic Development Canada expects amateur radio operators to address community concerns in a responsible manner: "That's correct: address community concerns responsibly."
  Prior to an installation, for which community concerns could be raised, amateur radio operators may be required to consult with their land-use authority: "That's correct: you may have to consult the land-use authority."
B-001-023-002:
  The provincial or territorial Minister of Infrastructure: The province doesn't have authority.
  The local municipal government: The municipality has a role, but authority is federal.
  The majority of neighbours within a distance of three times the proposed antenna height: Neighbours don't have authority.
B-001-023-003:
  In a rural area: Rural areas aren't automatically excluded.
  When the structure is part of an amateur radio antenna: Being an amateur antenna isn't an exclusion by itself.
  When transmitting will only be done at low power: Low power isn't an exclusion criterion.
B-001-023-004:
  Proceed without public consultation: You can't skip consultation.
  Develop their own public consultation process: You don't make up your own.
  Wait for the land-use authority to develop its own public consultation process: You don't wait; ISED's default applies.
B-001-023-005:
  Providing written notice: Written notice is part of it.
  Addressing relevant questions, comments and concerns: Addressing questions and concerns is part of it.
  Providing an opportunity for the public to respond regarding measures to address reasonable and relevant concerns: Letting the public respond is part of it.
B-001-023-006:
  all questions, comments and concerns raised: Only reasonable and relevant concerns, not all.
  comments reported in the media: Media comments aren't the test.
  opposition to the project: Opposition alone isn't the test.
B-001-023-007:
  The system is excluded by the provisions of Client Procedures Circular CPC-2-0-03: Either exclusion is enough, not only CPC-2-0-03.
  The system is excluded by the municipal process: Either exclusion is enough, not only the municipal one.
  The system is excluded by the municipal process AND the provisions of Client Procedures Circular CPC-2-0-03: It's either, not both.
B-001-023-008:
  The decision is postponed until an agreement is reached: It isn't postponed indefinitely.
  The decision is made by the local municipality: The municipality doesn't decide.
  The decision is made by a majority vote of residents within a radius of three times the antenna height: There's no vote.
B-001-023-009:
  10 metres: 10 m isn't a fixed rule.
  15 metres: 15 m depends on the exclusions that apply.
  21 metres: 21 m isn't a rule.
B-001-023-010:
  Innovation, Science and Economic Development Canada: ISED's default applies only where there's no local process.
  The person planning to erect an antenna structure: The proponent doesn't decide.
  The provincial government: The province doesn't decide.
