# One note per wrong option, keyed by the exact English option text from the ISED bank.
B-001-022-001:
  An accredited examiner may recover the cost of administering an examination: "That's correct: examiners may recover costs."
  An accredited examiner must hold an Amateur Radio Operator Certificate with Basic, Advanced, and Morse code qualifications: "That's correct: examiners hold all three qualifications."
  There are no fees for taking an examination for an Amateur Radio Operator Certificate at an Innovation, Science and Economic Development Canada office: "That's correct: ISED exams are free."
B-001-022-002:
  A disabled candidate, taking a Morse code sending test, may be allowed to recite the examination text in Morse code sounds: "That's correct: reciting Morse sounds is allowed."
  Examinations for disabled candidates may be given orally, or tailored to the candidate's ability to complete the examination: "That's correct: oral or tailored exams are allowed."
  After passing the basic exam, a disabled candidate may take the other exams in any order: "That's correct: other exams in any order."
B-001-022-003:
  $20 per qualification: $20 isn't a set fee.
  No fee may be charged: Examiners may charge to recover costs.
  $20 per examination sitting: There's no set sitting fee.
B-001-022-004:
  $20 per visit, regardless of the number of qualification examinations: There's no $20 visit fee.
  $20 per qualification: There's no $20 per qualification.
  $5 per qualification examination: There's no $5 fee.
B-001-022-005:
  A candidate who fails a written examination for lack of reading skills may be given an oral examination: "That's correct: oral exams for reading skills."
  A candidate who fails a written examination due to not usually speaking English or French may be given an oral examination: "That's correct: oral exams for language."
  An examiner may request medical evidence from a practising medical physician before accommodating testing: "That's correct: medical evidence may be requested."
