# One note per wrong option, keyed by the exact English option text from the ISED bank.
B-001-012-001:
  Donation of amateur radio equipment: Equipment donations count as payment.
  Donation of equipment repairs: Repairs count as payment.
  Any amount agreed upon in advance: No amount is allowed.
B-001-012-002:
  if the other station is using digital means: Digital or not doesn't matter.
  if transmitted in English or French: Language doesn't matter.
  during peacetime civil emergencies: Emergencies aren't the test; it must be an amateur transmission.
B-001-012-003:
  When a gift or gratuity replaces remuneration: A gift still counts.
  When a non-governmental organization is involved: NGOs don't change the rule.
  When the messages are exchanged outside a real emergency: It's prohibited in any situation.
B-001-012-004:
  Where it is for the purpose of protecting property or preventing harm: Protecting property is an allowed reason.
  Where it is for the purpose of giving evidence in a criminal or civil court: Court evidence is an allowed reason.
  Where it is on behalf of Canada, for the purpose of national defence or security: National defence is an allowed reason.
