# One note per wrong option, keyed by the exact English option text from the ISED bank.
B-006-003-001:
  Twin-lead: Twin-lead is affected by nearby metal.
  Open-wire line: Open-wire line is badly affected by nearby metal.
  Window line: Window line is affected by nearby metal.
B-006-003-002:
  Less impedance inserted in the signal path: Solid dielectric doesn't insert less impedance in the signal path.
  More flexible and easier to handle: Solid dielectric is stiffer, not more flexible.
  More impedance to common-mode current: The dielectric type doesn't change the choke's impedance much.
B-006-003-003:
  Less loss: Coax has more loss than open-wire line.
  More power handling capability: Open-wire line handles more power.
  Less expensive: Coax isn't the cheapest line.
B-006-003-004:
  An F-type connector: F-type is for TV cable.
  An SMA connector: SMA is for handhelds.
  A BNC connector: BNC is for low-power gear, not usually RG-213 on HF.
B-006-003-005:
  A PL-259 connector: PL-259 is for HF rigs on larger coax.
  An F-type connector: F-type is for TV.
  An RCA connector: RCA is an audio connector.
B-006-003-006:
  UHF: UHF (PL-259) isn't moisture resistant.
  BNC: BNC isn't designed for moisture resistance.
  SMA: SMA isn't the moisture-resistant one.
B-006-003-007:
  N: N connectors are for higher power and outdoor use.
  UHF: UHF connectors are for HF rigs.
  RCA: RCA is for audio.
B-006-003-008:
  To minimize dielectric losses: Dielectric loss is in the cable, not the connector contacts.
  To maintain lightning protection: Connectors aren't lightning protection.
  To prevent static electricity buildup: Static isn't the reason.
B-006-003-009:
  Aluminum foil: Foil gives poorer shielding than solid.
  Single braided shield: A single braid has gaps.
  Double braided shield: A double braid is good, but solid is best.
B-006-003-010:
  Open-wire line: Ice on open-wire line changes its impedance.
  Window line: Ice on window line changes its impedance.
  Twin-lead: Ice on twin-lead changes its impedance.
B-006-003-011:
  Higher power handling: Foam doesn't handle more power.
  Lower velocity factor: Foam has a higher velocity factor, not lower.
  Better mechanical stability: Foam is less mechanically stable.
